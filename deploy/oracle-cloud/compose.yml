services:
  bot:
    build:
      context: ./src
    container_name: repo-chat-bot
    restart: unless-stopped
    env_file: .env
    environment:
      REPO_PATH: /app/repo
    # Healthcheck port. Loopback-only by default — reachable from inside the VM
    # and via SSH tunnel (`ssh -L 8080:127.0.0.1:8080 ...`) but not the public
    # internet. Switch to "8080:8080" to allow external probes (OCI LB, etc.);
    # remember to also open the host firewall and VCN security list.
    # Requires HEALTHCHECK_ENABLED=true in .env to actually bind a listener.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./repo:/app/repo:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Container healthcheck — invokes the bot binary with --healthcheck, which
    # GETs /healthz on localhost and exits 0/1. Assumes HEALTHCHECK_ENABLED=true
    # in .env; set test: ["NONE"] to disable, or remove the block, if you've
    # turned the in-process HTTP server off.
    healthcheck:
      test: ["CMD", "/app/repo-chat-bot", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Resource limits — keep a runaway prompt / LLM-tool loop / memory leak
    # from taking down the host. Bump if you actually need more headroom.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
